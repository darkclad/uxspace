# Forgejo copy of .github/workflows/android.yml. Forgejo reads .forgejo/workflows and
# ignores .github/workflows when this directory exists. Differences: the self-hosted
# runner image (catthehacker ubuntu) has no Android SDK, so it is installed here, and
# actions not mirrored on data.forgejo.org are referenced by full GitHub URL.
name: Android

on:
  push:
    branches: [main]
    paths:
      - "Android/**"
      - ".forgejo/workflows/android.yml"
  pull_request:
    paths:
      - "Android/**"
      - ".forgejo/workflows/android.yml"
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: Android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: https://github.com/android-actions/setup-android@v3
        with:
          packages: "platform-tools ndk;30.0.14904198 cmake;4.1.2"

      - uses: https://github.com/gradle/actions/setup-gradle@v4

      # The VITURE SDK (glasses/src/main/jniLibs, cpp/include) is not in the repo, so CI
      # runs JVM unit tests only — no native build, no APK.
      - name: Run unit tests
        run: sh ./gradlew testDebugUnitTest --console=plain
